name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Sync fork with upstream via GitHub API
              run: |
                if [ -z "${{ secrets.SYNC_TOKEN }}" ]; then
                  echo "::error::仓库未设置 SYNC_TOKEN secret（需要 repo + workflow 作用域的 PAT），无法同步上游涉及工作流文件的变更"
                  exit 1
                fi
                echo "Syncing ${{ github.repository }} (branch: main) with upstream..."
                gh api -X POST "/repos/${{ github.repository }}/merge-upstream" \
                  -f branch=main \
                  --jq '"\(.message) (merge_type=\(.merge_type))"'
                echo "Sync completed successfully"
              env:
                GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
