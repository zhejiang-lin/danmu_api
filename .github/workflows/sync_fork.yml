name: Fork Sync

permissions:
    contents: write
    workflows: write  # 上游提交若包含工作流文件变更，同步时需要此权限

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Sync fork with upstream via GitHub API
              run: |
                echo "Syncing ${{ github.repository }} (branch: main) with upstream..."
                gh api -X POST "/repos/${{ github.repository }}/merge-upstream" \
                  -f branch=main \
                  --jq '"\(.message) (merge_type=\(.merge_type))"'
                echo "Sync completed successfully"
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
